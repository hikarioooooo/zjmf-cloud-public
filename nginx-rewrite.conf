# 放入该 PHP 站点的 server 配置；网站根目录就是上传目录。
location ~ /\. { deny all; }
location = /install-zjmf-cloud_new { rewrite ^ /index.php last; }
location = /other/authorize-cloud { rewrite ^ /index.php last; }
location = /site.json { rewrite ^ /index.php last; }
location = /other/helper.php { default_type application/octet-stream; try_files $uri =404; }
location ^~ /other/client/ { default_type application/octet-stream; try_files $uri =404; }
location / { try_files $uri $uri/ /index.php?$query_string; }
# 保留面板原有 PHP FastCGI 配置，PHP 7.2 或更高版本，并启用 openssl。
